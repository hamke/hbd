  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #000014;
      font-family: 'Segoe UI', sans-serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    .flare {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60vw;
      height: 60vw;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 200, 0, 0.4), transparent 70%);
      filter: blur(60px);
      z-index: 1;
      border-radius: 50%;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.7;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 1;
      }
    }

    .core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20vw;
      height: 20vw;
      background: radial-gradient(circle at center, #111 20%, #000 100%);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 2;
      box-shadow: 0 0 80px rgba(255, 200, 0, 0.15);
    }

    .hello {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.8vw;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0.25em;
      text-shadow: 0 0 20px rgba(255, 230, 150, 0.4);
      z-index: 3;
      white-space: nowrap;
      opacity: 0;
      animation: fadeIn 3s ease-in 1s forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* 📱 화면 너비 768px 이하에서는 고정 크기 적용 */
    @media (max-width: 768px) {
      .flare {
        width: 540px;
        height: 540px;
      }

      .core {
        width: 180px;
        height: 180px;
      }

      .hello {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="flare"></div>
    <div class="core"></div>
    <div class="hello">HAEBODA</div>
  </div>
</body>
